<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Ekle</title>
</head>

<body>

<header>
    <h1>Etkinlik Ekle</h1>

    <nav>
        <a href="etkinlikler.html">Ana Sayfa</a> |
        <a href="etkinlikler.html">Etkinlikler</a> |
        <a href="etkinlik-ekle.html">Etkinlik Ekle</a>
    </nav>
</header>

<main>

    <form>

        <p>
            <label for="etkinlikAdi">Etkinlik Adı</label><br>
            <input type="text" id="etkinlikAdi" name="etkinlikAdi">
        </p>

        <p>
            <label for="kategori">Kategori</label><br>
            <select id="kategori" name="kategori">
                <option>Seminer</option>
                <option>Atölye</option>
                <option>Konferans</option>
                <option>Spor</option>
            </select>
        </p>

        <p>
            <label for="tarih">Tarih / Saat</label><br>
            <input type="datetime-local" id="tarih" name="tarih">
        </p>

        <p>
            <label for="yer">Yer</label><br>
            <input type="text" id="yer" name="yer">
        </p>

        <p>
            <label for="aciklama">Açıklama</label><br>
            <textarea id="aciklama" name="aciklama" rows="5" cols="40"></textarea>
        </p>

        <p>
            <label for="afis">Afiş</label><br>
            <input type="file" id="afis" name="afis">
        </p>

        <button type="submit">Kaydet</button>

    </form>

</main>

<footer>
    <p>Kampüs Etkinlikleri © 2026</p>
</footer>

</body>
</html>
